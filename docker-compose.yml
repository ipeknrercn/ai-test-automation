version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # .env içindeki değerleri Docker ortamına göre eziyoruz
      - DATABASE_URL=postgresql://user:password@db:5432/ai_test_db
      - PORT=3001
    depends_on:
      - db
    volumes:
      - ./backend/test-results:/app/test-results

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: