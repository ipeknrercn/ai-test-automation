server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA için - bilinmeyen path'leri index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API çağrılarını backend servisine proxy et
    location /api {
        proxy_pass https://promptqa-backend.onrender.com/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host promptqa-backend.onrender.com;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        
        
    }
        
   
    
    # Screenshot dosyalarını backend'den proxy et
    location /screenshots {
        proxy_pass https://promptqa-backend.onrender.com/;
        proxy_http_version 1.1;
        proxy_set_header Host promptqa-backend.onrender.com;
    }

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
